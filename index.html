      --card-bg: #161f30;
      --card-hover: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --border-color: rgba(255, 255, 255, 0.08);
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.6);

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* Header & Sticky Navigation */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 15, 25, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
    }

    .header-container {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .logo-title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .logo-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn {
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
    }

    .nav-btn:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-btn.active {
      background: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    .total-badge {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .search-wrap { flex: 1; min-width: 140px; max-width: 320px; }
    .search-input {
      width: 100%;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus {
      border-color: rgba(99, 102, 241, 0.55);
      background: rgba(255, 255, 255, 0.08);
    }
    .gallery-card.is-hidden { display: none !important; }

    /* Main Grid Layout */
    .container {
      max-width: 1600px;
      margin: 24px auto;
      padding: 0 20px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    @media (max-width: 1199px) and (min-width: 769px) {
      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .header {
        padding: 12px 16px;
      }

      .container {
        padding: 0 12px;
        margin: 16px auto;
      }

      .logo-subtitle {
        display: none;
      }

      .search-wrap { max-width: none; flex: 1 1 100%; order: 3; }
      .header-container { gap: 10px; }
    }

    /* Card Item Styling */
    .gallery-card {
      position: relative;
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: inherit;
    }

    .gallery-card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow: var(--shadow-lg), 0 0 20px rgba(99, 102, 241, 0.25);
      z-index: 2;
    }

    .gallery-card img,
    .gallery-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      transition: transform 0.4s ease;
    }

    .gallery-card:hover img,
    .gallery-card:hover video {
      transform: scale(1.06);
    }

    .gallery-card.is-video::after {
      content: "▶";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border-radius: 50%;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      padding-left: 3px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .gallery-card.is-video:hover::after {
      background: var(--accent-color);
      transform: translate(-50%, -50%) scale(1.15);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.8);
    }

    .media-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(6px);
      color: #e2e8f0;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      pointer-events: none;
      letter-spacing: 0.05em;
      z-index: 1;
    }

    .external-card {
      background: linear-gradient(145deg, #1e1b4b, #2e1065);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      border-color: rgba(168, 85, 247, 0.3);
    }

    .external-card:hover {
      border-color: #a855f7;
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.35);
    }

    .external-card-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .external-card-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #f3e8ff;
      line-height: 1.3;
      word-break: break-word;
    }

    .iframe-card {
      overflow: hidden;
    }

    .iframe-card iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.94);
      backdrop-filter: blur(16px);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-content-wrapper {
      position: relative;
      max-width: 90vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .lightbox-media-container {
      max-width: 100%;
      max-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 14px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      background: #000;
      border: 1px solid var(--border-color);
    }

    .lightbox-media-container img,
    .lightbox-media-container video {
      max-width: 90vw;
      max-height: 75vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .lightbox-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      z-index: 1010;
    }

    .lightbox-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lightbox-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.1);
    }

    .lightbox-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 1005;
    }

    .lightbox-nav-btn:hover {
      background: var(--accent-color);
      border-color: var(--accent-color);
      transform: translateY(-50%) scale(1.1);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.6);
    }

    .lightbox-nav-prev {
      left: 24px;
    }

    .lightbox-nav-next {
      right: 24px;
    }

    @media (max-width: 640px) {

      .lightbox-nav-prev,
      .lightbox-nav-next {
        width: 42px;
        height: 42px;
        font-size: 18px;
      }

      .lightbox-nav-prev {
        left: 10px;
      }

      .lightbox-nav-next {
        right: 10px;
      }

      .lightbox-controls {
        top: 10px;
        right: 10px;
      }
    }

    .lightbox-footer {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      color: var(--text-muted);
      font-size: 0.9rem;
      gap: 16px;
    }

    .lightbox-filename {
      font-weight: 600;
      color: #f1f5f9;
    }

    .lightbox-counter {
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 12px;
      border-radius: 12px;
    }

    .lightbox-open-btn {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      transition: all 0.2s ease;
    }

    .lightbox-open-btn:hover {
      background: var(--accent-color);
      color: #fff;
    }

    /* Back to Top */
    .back-top-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--accent-color);
      color: #fff;
      border: none;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 90;
    }

    .back-top-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .back-top-btn:hover {
      transform: translateY(-3px) scale(1.08);
      background: var(--accent-hover);
    }
  </style>
</head>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-controls">
      <button class="lightbox-btn" id="lightboxCloseBtn" title="Kapat (Esc)">✕</button>
    </div>
    <button class="lightbox-nav-btn lightbox-nav-prev" id="lightboxPrevBtn" title="Önceki (Sol Ok)">❮</button>
    <button class="lightbox-nav-btn lightbox-nav-next" id="lightboxNextBtn" title="Sonraki (Sağ Ok)">❯</button>
    <div class="lightbox-content-wrapper">
      <div class="lightbox-media-container" id="lightboxMediaContainer"></div>
      <div class="lightbox-footer">
        <span class="lightbox-filename" id="lightboxFilename"></span>
        <span class="lightbox-counter" id="lightboxCounter"></span>
        <a href="#" target="_blank" class="lightbox-open-btn" id="lightboxOpenBtn">↗ Sekmede Aç</a>
      </div>
    </div>
  </div>

  <button class="back-top-btn" id="backTopBtn" title="Yukarı Çık">▲</button>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cards = Array.from(document.querySelectorAll('.gallery-card'));
      const lightbox = document.getElementById('lightbox');
      const lightboxMediaContainer = document.getElementById('lightboxMediaContainer');
      const lightboxFilename = document.getElementById('lightboxFilename');
      const lightboxCounter = document.getElementById('lightboxCounter');
      const lightboxOpenBtn = document.getElementById('lightboxOpenBtn');
      const closeBtn = document.getElementById('lightboxCloseBtn');
      const prevBtn = document.getElementById('lightboxPrevBtn');
      const nextBtn = document.getElementById('lightboxNextBtn');
      const backTopBtn = document.getElementById('backTopBtn');

      let currentIndex = 0;
      const mediaItems = [];

      cards.forEach((card) => {
        const href = card.getAttribute('href');
        if (!href) return;

        const isVideo = href.match(/\.(mp4|MP4|mov|MOV)($|\?|#)/i);
        const isImage = href.match(/\.(gif|GIF|jpg|JPG|png|PNG|jpeg|JPEG|webp)($|\?|#)/i);

        if (isVideo || isImage) {
          card.classList.add('lightbox-trigger');
          if (isVideo) card.classList.add('is-video');
          if (!card.querySelector('.media-badge')) {
            const ext = href.split('.').pop().split('#')[0].split('?')[0].toUpperCase();
            const badge = document.createElement('span');
            badge.className = 'media-badge';
            badge.textContent = ext;
            card.appendChild(badge);
          }
          const itemIndex = mediaItems.length;
          mediaItems.push({ url: href, type: isVideo ? 'video' : 'image', filename: href, card: card });
          card.addEventListener('click', (e) => { e.preventDefault(); openLightbox(itemIndex); });
        }
      });

      const totalBadge = document.getElementById('totalBadge');
      if (totalBadge) totalBadge.textContent = `${mediaItems.length} Medya`;

      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', () => {
          const q = searchInput.value.trim().toLowerCase();
          let visible = 0;
          cards.forEach(card => {
            const href = (card.getAttribute('href') || '') + ' ' + (card.textContent || '');
            const match = !q || href.toLowerCase().includes(q);
            card.classList.toggle('is-hidden', !match);
            if (match) visible++;
          });
          if (totalBadge) totalBadge.textContent = q ? `${visible} / ${cards.length}` : `${mediaItems.length} Medya`;
        });
      }

      function openLightbox(index) {
        if (index < 0 || index >= mediaItems.length) return;
        currentIndex = index;
        const item = mediaItems[currentIndex];
        lightboxMediaContainer.innerHTML = '';
        if (item.type === 'video') {
          const videoEl = document.createElement('video');
          videoEl.src = item.url;
          videoEl.controls = true;
          videoEl.autoplay = true;
          videoEl.loop = true;
          videoEl.setAttribute('playsinline', '');
          lightboxMediaContainer.appendChild(videoEl);
        } else {
          const imgEl = document.createElement('img');
          imgEl.src = item.url;
          imgEl.alt = item.filename;
          lightboxMediaContainer.appendChild(imgEl);
        }
        lightboxFilename.textContent = item.filename;
        lightboxCounter.textContent = `${currentIndex + 1} / ${mediaItems.length}`;
        lightboxOpenBtn.href = item.url;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
        lightboxMediaContainer.innerHTML = '';
      }

      function showNext() { openLightbox((currentIndex + 1) % mediaItems.length); }
      function showPrev() { openLightbox((currentIndex - 1 + mediaItems.length) % mediaItems.length); }

      if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
      if (nextBtn) nextBtn.addEventListener('click', showNext);
      if (prevBtn) prevBtn.addEventListener('click', showPrev);

      lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
      document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') showNext();
        if (e.key === 'ArrowLeft') showPrev();
      });

      window.addEventListener('scroll', () => { backTopBtn.classList.toggle('visible', window.scrollY > 400); });
      backTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    });
  </script>
